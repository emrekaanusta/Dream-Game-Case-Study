function home(){return `
<section class="hero home-hero"><div class="hero-copy"><div class="eye">A FIELD GUIDE TO PUZZLE DESIGN <span> / 01—05</span></div><h1>Inside<br><em>the Puzzle.</em></h1>
<p class="sub">Two games. Two systems. A closer look at how mobile puzzle design works.</p>
<p>Royal Match and Toon Blast share a genre, but ask players to think in different ways. This case study follows the mechanics, level structure, feedback and progression that make each experience distinct — then carries those observations into an original game concept.</p><a class="hero-cta" href="#/comparison">Explore the comparison <span>↗</span></a></div>
<div class="col hero-board" aria-label="A collage of puzzle gameplay"><span class="blob blob-one"></span><span class="blob blob-two"></span><div class="hero-stamp">PLAY<br>OBSERVE<br>DESIGN</div>
<img class="a" src="${U(CP+"01_Core_Gameplay/01_Royal_Match_Gameplay.jpeg")}" alt="Royal Match gameplay screenshot"><img class="b" src="${U(CP+"01_Core_Gameplay/02_Toon_Blast_Gameplay.jpeg")}" alt="Toon Blast gameplay screenshot"><img class="c" src="${U(RM+"06_User Interface/01_main_screen.jpeg")}" alt="Royal Match main screen"></div></section>
<section class="progress-section"><div class="section-kicker"><span>FIELD NOTES</span><span>MY CURRENT PROGRESS</span></div><div class="progress-board" aria-label="Current analysis progress">
<a class="progress-main royal" href="#/royal-match"><span class="game-name">Royal Match</span><span class="level-number">150</span><span class="level-label">LEVEL REACHED <b>↗</b></span><span class="progress-shape"></span></a>
<a class="progress-main toon" href="#/toon-blast"><span class="game-name">Toon Blast</span><span class="level-number">150</span><span class="level-label">LEVEL REACHED <b>↗</b></span><span class="progress-shape"></span></a>
<div class="progress-secondary"><div class="progress-mini kingdom"><span>Royal Kingdom</span><b>250 <small>LVL</small></b></div><div class="progress-mini"><span>Match Villains</span><b>200 <small>LVL</small></b></div><div class="progress-mini"><span>Homescapes</span><b>100 <small>LVL</small></b></div></div><p class="progress-note">The two featured games are the primary focus of this project. Other games are tracked as secondary references.</p></div></section>
<section class="explore-section"><div class="explore-heading"><div><div class="eye">PICK A PATH</div><h2>Choose Your<br><em>Exploration.</em></h2></div><p>Follow a game, compare the systems, or step inside the concept I’m building from these observations.</p></div>
<div class="explore-grid">
<a class="explore-card rm featured" href="#/royal-match"><span class="explore-index">01 / MATCH-3</span><h3>Royal Match</h3><p>Layered obstacles, power-ups and a renovation loop built around each win.</p><span class="explore-link">Enter the kingdom <b>↗</b></span><img loading="lazy" src="${U(RM+"06_User Interface/01_main_screen.jpeg")}" alt="Royal Match main screen"><span class="card-orbit">RM</span></a>
<a class="explore-card tb" href="#/toon-blast"><span class="explore-index">02 / TAP-TO-BLAST</span><h3>Toon Blast</h3><p>Connected groups, cascading cubes and explosive combinations.</p><span class="explore-link">Blast off <b>↗</b></span><img loading="lazy" src="${U(TB+"07_User_Interface/01_main_screen.jpeg")}" alt="Toon Blast main screen"><span class="card-orbit">TB</span></a>
<a class="explore-card compare-card" href="#/comparison"><span class="explore-index">03 / SIDE BY SIDE</span><h3>Comparison</h3><p>Seven design lenses. Two different approaches to the same broad genre.</p><span class="explore-link">Compare the systems <b>↗</b></span><div class="compare-pair"><img loading="lazy" src="${U(CP+"01_Core_Gameplay/01_Royal_Match_Gameplay.jpeg")}" alt="Royal Match gameplay"><span>VS</span><img loading="lazy" src="${U(CP+"01_Core_Gameplay/02_Toon_Blast_Gameplay.jpeg")}" alt="Toon Blast gameplay"></div></a>
<a class="explore-card haven-card" href="#/animal-haven"><span class="explore-index">04 / ORIGINAL CONCEPT</span><h3>Animal Haven</h3><p>Turning observations into a swap-to-match game about rescuing animals and growing a sanctuary.</p><span class="explore-link">Visit the concept <b>↗</b></span><img loading="lazy" src="animal-haven/Home%20Page.jpeg" alt="Animal Haven home screen concept" onerror="this.outerHTML='<div class=&quot;haven-mark&quot;>AH</div>'"><span class="card-orbit">AH</span></a>
</div></section>
`}

const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const rmMedia=m=>m.type==="video"?`<figure class="v"><video controls preload="none" playsinline poster="${U(m.poster||"")}" src="${U(m.src)}"></video><figcaption>${esc(m.caption||"")}</figcaption></figure>`:`<figure><img loading="lazy" src="${U(m.src)}" alt="${esc(m.caption||"")}"><figcaption>${esc(m.caption||"")}</figcaption></figure>`;
function page(c,route,col,cv){if(!c)return"<p>Content file missing.</p>";let n=0;const op=[].concat(c.opening);
const normalGroup=g=>{const m=g.media||[];const h=g.level||3;const t=`<h${h}>${esc(g.title)}</h${h}>`+(g.text||[]).map(p=>`<p>${esc(p)}</p>`).join("");if(!m.length)return `<article class="g solo${h===4?" sub":""}"><div class="t">${t}</div></article>`;n++;return `<article class="g${g.layout==="wide"?" wide":n%2===0?" alt":""}"><div class="t">${t}</div><div class="m${m.length>2?" multi":""}">${m.map(rmMedia).join("")}</div></article>`};
const groupsHtml=s=>{let out="";for(let i=0;i<s.groups.length;i++){const g=s.groups[i];if(g.title==="Power-up Combinations"||g.title==="Power-Up Combinations") {out+=normalGroup(g).replace('<article class="g','<article class="g combo-intro');const items=[];for(let j=i+1;j<s.groups.length;j++){const x=s.groups[j];if(x.title==="Special Missions"||x.title==="Boosters")break;items.push(x);i=j;}const theme=route==="toon-blast"?"toon":"royal";out+=`<div class="combo-grid ${theme}" aria-label="Power-up combinations">${items.map(x=>`<article class="combo-card"><h4>${esc(x.title)}</h4>${(x.text||[]).map(p=>`<p>${esc(p)}</p>`).join("")}</article>`).join("")}</div>`;continue;}out+=normalGroup(g);if(route==="toon-blast"&&g.title==="Boosters")out+=`<p class="source-note">Booster effects checked against the <a href="https://peakgames.helpshift.com/hc/en/4-toon-blast/faq/8-what-are-boosters/" target="_blank" rel="noopener">official Toon Blast Help Center ↗</a>.</p>`;}return out};
return `<div class="eye">INDIVIDUAL ANALYSIS</div><h1 style="color:${cv}">${esc(c.title)}</h1><p class="sub">${esc(c.subtitle)}</p>${op.map(p=>`<p>${esc(p)}</p>`).join("")}<p><em>${esc(c.scope)}</em></p><ul class="toc" style="--c:${col}">${c.sections.map((s,i)=>`<li><a href="#/${route}" data-s="${route}-${i+1}">${i+1}. ${esc(s.title)}</a></li>`).join("")}</ul>`+c.sections.map((s,i)=>`<section id="${route}-${i+1}" class="rs"><div class="eye">0${i+1}</div><h2>${esc(s.title)}</h2>${groupsHtml(s)}</section>`).join("")}

function royal(){return page(window.ROYAL_CONTENT,"royal-match","#477BFF","var(--rm)")}
function toon(){return page(window.TOON_CONTENT,"toon-blast","#FF5A68","var(--tc)")}
const tbMech=[["01_basic_tap_to_blast.png","Tap to Blast"],["02_balloon_objective.jpeg","Balloons"],["08_box_obstacle.jpeg","Boxes"],["03_rocket_power_up.jpeg","Rocket"],["04_bomb_power_up.jpeg","Bomb"],["05_disco_ball_power_up.jpeg","Disco Ball"],["06_power_up_combinations.jpeg","Power-up Combinations"],["07_hammer_booster.jpeg","Hammer"],["10_anvil_booster.jpeg","Anvil"],["11_boxing_glove_booster.jpeg","Boxing Glove"],["12_dice_booster.jpeg","Dice"],["09_bruno_rescue_mission.jpeg","Bruno Rescue"],["13_magic_hat_obstacle.jpeg","Magic Hat"],["14_duck_objective.jpeg","Ducks"],["15_bubble.jpeg","Bubble"]].map(x=>[TB+"01_Game_Mechanics/"+x[0],x[1]]);
const tbLD=["01_early_level_board","02_new_mechanic_introduction","03_multiple_objectives","04_power_up_combo_level","06_duck_objective_level","07_later_level_board"].map(n=>[TB+"02_Level_Design/"+n+".jpeg",n.slice(3).replace(/_/g," ")]);
const tbG=[["04_Graphics/01_gameplay_color_palette.jpeg","Gameplay colour palette"],["04_Graphics/02_character_art_style.webp","Character art style"],["04_Graphics/04_power_up_visual_design.jpeg","Power-up visual design"],["04_Graphics/05_level_map_and_world.jpeg","Level map and world"],["04_Graphics/06_visual_hierarchy.jpeg","Visual hierarchy"]].map(x=>[TB+x[0],x[1]]);
const tbV=[["01_cube_blast_and_falling","Cube blast and falling"],["02_rocket_activation","Rocket activation"],["03_power_up_combination","Power-up combination"],["04_disco_ball_combination_sequence","Disco Ball combination sequence"],["05_level_completion","Level completion"]];
const tbP=[["01_cube_blast_effect","Cube blast effect"],["02_rocket_trail_and_explosion","Rocket trail and explosion"],["03_bomb_explosion","Bomb explosion"],["04_disco_ball_activation_effect","Disco Ball activation"],["05_level_completion_effects","Level completion effects"]].map(x=>[TB+"06_Particles_and_Special_Effects/"+x[0]+".jpeg",x[1]]);
const tbU=[["07_User_Interface/01_main_screen.jpeg","Main screen"],["07_User_Interface/02_level_start_screen.jpeg","Level start"],["07_User_Interface/03_in_game_interface.jpeg","In-game interface"],["07_User_Interface/04_level_complete_screen.jpeg","Level complete"],["07_User_Interface/05_event_or_collection_screen.jpeg","Event or collection"],["06_Particles_and_Special_Effects/08_event_and_popup_ui.jpeg","Event and pop-up UI"]].map(x=>[TB+x[0],x[1]]);

const C=(n,t,intro,items,take)=>`<section id="cmp-${n}"><div class="eye" style="color:#c77a00">0${n}</div><h2>${t}</h2><p>${intro}</p><div class="cmp">${items.map(i=>`<div>${i[0]}<h3 style="margin-top:.5rem">${i[1]}</h3>${fig(CP+i[3],i[1])}<p>${i[2]}</p></div>`).join("")}</div><p class="take">${take}</p></section>`;
const rm=t=>RMt,tb=TBt;
function compare(){return `<div class="eye" style="color:#c77a00">COMPARISON</div><h1>Two Games, Side by Side</h1><p class="sub">Comparing the design decisions behind two different puzzle systems.</p>
<p>Both games ask players to solve board-based objectives within limited moves, but they differ in how players create matches, use power-ups, experience difficulty and engage with progression systems outside a level.</p><p><em>This comparison focuses on my first 50 levels of each game. The observations are based on gameplay, selected screenshots and recordings. Subjective impressions are labelled as such.</em></p>
${C(1,"Core Gameplay & Mechanics","The most fundamental difference is the action required to make progress. Royal Match uses swapping to create matches, while Toon Blast uses taps to remove connected groups.",[[RMt,"Swap to match","Royal Match uses a traditional match-3 system: players swap adjacent pieces to create matches, clear obstacles and complete level objectives within a limited number of moves.","01_Core_Gameplay/01_Royal_Match_Gameplay.jpeg"],[TBt,"Tap groups to blast","Toon Blast replaces swapping with tap-to-blast gameplay. Players select connected cubes of the same color, making group size and the arrangement of the board central to each move.","01_Core_Gameplay/02_Toon_Blast_Gameplay.jpeg"]],"Both games use limited moves and obstacle-based objectives, but their fundamental interaction differs: Royal Match asks players to create matches by swapping, while Toon Blast asks them to identify and remove connected groups.")}
${C(2,"Power-ups & Combos","Power-ups extend the basic interaction model by letting a move affect more of the board. Their individual effects and combinations are an important part of each game's strategic layer.",[[RMt,"A distinct power-up","Royal Match includes a Propeller as one of its power-ups. It is a distinct part of the game's toolkit and provides a useful point of comparison with Toon Blast's Rocket, Bomb and Disco Ball system.","02_Power_Ups_Combos/01_Royal_Match_Propeller.jpeg"],[TBt,"Different power-up toolkit","Toon Blast uses Rockets, Bombs and Disco Balls. These power-ups and their combinations create larger clears and provide different ways to approach board objectives.","02_Power_Ups_Combos/02_Toon_Blast_Rocket_Disco_Ball.jpeg"],[RMt,"Effects that overlap","The overlapping line effects sweep across much of the board at once, creating a dense clear that feels bigger than any single effect. I could not identify the exact combination from this frame, so I describe the effect without assigning it a specific rule.","02_Power_Ups_Combos/03_Royal_Match_Power_Up_Combo.jpeg"]],"Royal Match and Toon Blast both use power-ups to expand the effect of a move. Royal Match's Propeller is a distinct targeting-related element in the toolkit. In my experience, Royal Match combinations often felt faster and more simultaneous, while Toon Blast combinations felt more sequential. This is a subjective impression, not a timed measurement.")}
${C(3,"Level Design & Progression","Level design combines the immediate puzzle with the longer progression around it. Both games introduce objectives and obstacles, but their wider progression systems differ.",[[RMt,"Layering familiar rules","Royal Match introduces boxes and grass, then combines these elements on later boards. Layered obstacles increase the number of hits required without necessarily introducing an entirely new interaction rule.","03_Level_Design_Progression/01_Royal_Match_Boxes_Grass.jpeg"],[TBt,"Groups, obstacles and objectives","Toon Blast uses connected cube groups alongside level-specific obstacles and objectives. The arrangement of the board influences which groups contribute most directly to progress.","03_Level_Design_Progression/02_Toon_Blast_Obstacles.jpeg"],[RMt,"Puzzle wins build something bigger","Winning levels awards stars that can be spent on castle renovation. This connects individual puzzle victories to visible progress outside the level, creating an additional reason to keep playing.","03_Level_Design_Progression/03_Royal_Match_Castle_Renovation.jpeg"]],"The puzzle board provides the immediate challenge, while the surrounding progression gives that challenge a broader context. Royal Match's renovation loop was particularly motivating in my experience.")}
${C(4,"Level Difficulty","Difficulty is not determined by a label alone. Move limits, objectives, obstacle placement and the experience of a failed attempt all contribute to how challenging a level feels.",[[RMt,"Difficulty signposting","Royal Match marks selected levels as hard or super hard before the player enters them. Across my first 50 levels, the game generally felt balanced and relatively forgiving, although individual levels could still become challenging.","04_Level_Difficulty/01_Royal_Match_Hard_Level.jpeg"],[TBt,"When moves run out","The failure screen makes the consequence of running out of moves explicit and presents another attempt as the next step. This is a useful point for examining how the game handles failure and re-entry.","04_Level_Difficulty/02_Toon_Blast_Level_Failed.jpeg"]],"Across my first 50 levels, Toon Blast felt harder and less even in difficulty, while Royal Match felt more balanced and forgiving. This is a subjective observation from a limited sample, not a measured difficulty curve.")}
${C(5,"Graphics & Visual Polish","The two games have different visual identities. Comparing their tiles, backgrounds, characters and interface hierarchy helps show how each game presents information and establishes its atmosphere.",[[RMt,"Polished and consistent","Royal Match uses glossy pieces, detailed environments and a consistent visual language across its gameplay and characters. Its visual presentation felt polished from the beginning of my playthrough.","05_Graphics_Visual_Polish/01_Royal_Match_Visual_Style.jpeg"],[TBt+" Early Levels","Early visual presentation","The early Toon Blast boards felt more dated to me, particularly when compared with Royal Match. This is a personal impression based on the visual examples in the archive.","05_Graphics_Visual_Polish/02_Toon_Blast_Early_Levels.jpeg"],[TBt+" Later Levels","Later visual presentation","The later-level screenshot provides a comparison point for board composition and color use. It lets the viewer compare the visual presentation across the levels examined.","05_Graphics_Visual_Polish/03_Toon_Blast_Later_Levels.jpeg"],["","Royal Match loading screen","Royal Match carries its polished, character-led fantasy style into the loading screen, extending the game world beyond the board.","05_Graphics_Visual_Polish/04_Royal_Match_Loading_Screen.jpeg"],["","Toon Blast loading screen","Toon Blast keeps its playful, character-led tone on the loading screen, with a brighter and more cartoon-like presentation.","05_Graphics_Visual_Polish/05_Toon_Blast_Loading_Screen.jpeg"]],"I compare the games through their colour palettes, tile designs, backgrounds, character art and overall presentation. Royal Match felt more polished and cohesive to me, while Toon Blast’s brighter, simpler presentation gave its boards a different personality.")}
${C(6,"Animation & Special Effects","Animation and visual effects make player actions readable and satisfying. These comparisons focus on visible feedback rather than claiming to measure the underlying technical implementation.",[[RMt+" Disco Ball","Royal Match — Light Ball","Royal Match’s Light Ball creates a bright, high-contrast activation effect. Its glow and expanding visual burst draw attention to the power-up before the clear resolves across the board.","06_Animation_Special_Effects/01_Royal_Match_Disco_Ball_Effect.jpeg"],[TBt+" Disco Ball","Toon Blast — Disco Ball","Toon Blast’s Disco Ball removes cubes of the selected colour across the board. The simultaneous clear creates a strong burst of activity, spreading across many tiles at once.","06_Animation_Special_Effects/02_Toon_Blast_Disco_Ball_Effect.jpeg"],[RMt+" Obstacle destruction","Royal Match — Obstacle break","A flash, movement and debris mark the hit as it lands. The feedback helps distinguish a damaged obstacle from one that has been fully removed.","06_Animation_Special_Effects/03_Royal_Match_Obstacle_Break_Effect.jpeg"],[TBt+" Cube destruction","Toon Blast — Cube blast","Toon Blast reinforces a successful blast with movement and colourful particles as cubes disappear and the board settles into its next state.","06_Animation_Special_Effects/04_Toon_Blast_Obstacle_Break_Effect.jpeg"]],"Still images capture the appearance of an effect, but videos are better evidence for timing, pacing and chain reactions. The individual game pages contain recordings that provide this additional context.")}
${C(7,"UI & Meta-game","The user interface connects individual levels to the broader game experience. The main screen, level screens, rewards, renovation, teams and events all influence how players move between activities.",[[RMt,"Progression is always visible","The main screen places castle progression and other game systems around the central environment. I found the castle-renovation entry point in the lower-left area relatively easy to notice, making the reward loop clear.","07_UI_Meta_Game/01_Royal_Match_Main_Screen.jpeg"],[TBt,"Multiple routes back into play","Toon Blast's main screen places events and other activities around the central game world. This provides a useful contrast in how the two games present progression and secondary activities outside the puzzle board.","07_UI_Meta_Game/02_Toon_Blast_Main_Screen.jpeg"]],"Royal Match directly links stars earned from puzzle levels to castle renovation. Toon Blast presents a different surrounding structure, including teams and events. I also noticed more purchase prompts during my Toon Blast playthrough, although this is a personal observation rather than a measured frequency.")}
<section id="learn"><h2>What Can We Learn From Each Game?</h2><p>Comparing Royal Match and Toon Blast shows how two games can use the same broad genre while building different interactions, feedback systems and progression experiences.</p>
<h3>1. Make the core interaction distinct</h3><p>Royal Match builds around swapping pieces, while Toon Blast builds around selecting connected groups. The primary interaction influences how players evaluate a board and choose their next move.</p>
<h3>2. Give each power-up a clear role</h3><p>Power-ups are more useful as a design system when each one has a distinguishable purpose. Line effects, area effects and other special interactions can encourage players to consider both the immediate board and the opportunity to combine effects.</p>
<h3>3. Introduce complexity progressively</h3><p>The early Royal Match examples show how familiar rules can be reused with layered obstacles and mixed boards. Progression can increase planning demands without requiring every level to introduce an entirely new rule.</p>
<h3>4. Consider the experience beyond the level</h3><p>Royal Match's star-and-renovation loop connects a short puzzle to a longer-term visual goal. The broader experience around a level can give the result of a win meaning beyond the board itself.</p>
<h3>5. Treat feedback as part of gameplay</h3><p>Animation, particles and clear visual responses help players understand what their actions accomplished. A successful move should communicate its result clearly, especially when a power-up triggers a larger effect.</p>
<p class="take">These observations provide a starting point for my own game-design work: build a clear core interaction, introduce complexity with purpose, make actions readable, and connect individual challenges to a meaningful broader experience.</p></section>`}
